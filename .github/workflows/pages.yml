# פריסה ל-GitHub Pages מתוך הריפו עצמו.
#
# למה דרך Actions ולא דרך מסך ההגדרות: configure-pages עם enablement
# מפעיל את Pages בעצמו אם הוא כבוי. כך הפריסה כולה נובעת מ-git push
# ואינה דורשת אף קליק בממשק.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # רק קבצי האתר. בדיקות, סקריפטים וכלי בנייה לא מתפרסמים.
      - name: Collect site
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js db.js ai.js taxonomy.js \
             charts.js insights.js stats.js crypto.js sw.js \
             manifest.webmanifest _site/
          cp icons/*.png _site/icons/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
