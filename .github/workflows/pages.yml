# פריסה ל-GitHub Pages מתוך הריפו עצמו.
#
# למה דרך Actions ולא דרך מסך ההגדרות: configure-pages עם enablement
# מפעיל את Pages בעצמו אם הוא כבוי. כך הפריסה כולה נובעת מ-git push
# ואינה דורשת אף קליק בממשק.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # שתי מערכות פריסה רצו במקביל: זו, וגם פריסת-הענף המובנית של Pages.
      # מי שסיימה אחרונה קבעה — ולפעמים זו הייתה הגרסה הלא-חתומה.
      # המעבר ל-build_type=workflow מכבה את פריסת-הענף לתמיד.
      - name: Force workflow-only deploys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            && echo "switched to workflow builds" \
            || echo "switch failed — legacy branch deploy may still race"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # רק קבצי האתר. בדיקות, סקריפטים וכלי בנייה לא מתפרסמים.
      - name: Collect site
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js db.js ai.js taxonomy.js \
             charts.js insights.js stats.js crypto.js sw.js \
             manifest.webmanifest _site/
          cp icons/*.png _site/icons/

          # חותמת גרסה — כדי שתמיד אפשר לדעת איזו גרסה באמת רצה על המכשיר,
          # ושהמטמון של ה-Service Worker יתבטל בכל פריסה.
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/const CACHE = 'kesef-v5';/const CACHE = 'kesef-$BUILD';/" _site/sw.js
          sed -i "s/__BUILD__/$BUILD/" _site/app.js
          echo "build: $BUILD"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
